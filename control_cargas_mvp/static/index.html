<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122e3a"><link rel="manifest" href="/static/manifest.json"><title>Control de Cargas · Del Palacio</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173440;background:#edf3f4}*{box-sizing:border-box}body{margin:0}.top{background:#122e3a;color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.top small{color:#b7d7dd}.wrap{max-width:850px;margin:auto;padding:14px}h1{font-size:22px}h2{font-size:19px;margin:0 0 12px}h3{margin:4px 0 10px}.card{background:white;padding:17px;border-radius:16px;margin-bottom:13px;box-shadow:0 1px 4px #092a3010}.muted{color:#607780;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:650;color:white;background:#176b86;min-height:44px}.btn:disabled,button:disabled{opacity:.42;cursor:not-allowed}.ok{background:#17845e}.warn{background:#ca7b19}.danger{background:#b83b36}.secondary{background:#e9f1f2;color:#184252}.outline{background:#fff;color:#185570;border:1px solid #abc4cc}input,textarea,select{font:inherit;width:100%;padding:11px;border:1px solid #b9cdd1;border-radius:9px;margin-top:5px}label{font-size:13px;font-weight:650}.field{margin-bottom:12px}.tag{border-radius:24px;padding:5px 9px;background:#e7eef0;color:#355461;font-size:12px}.tag.done{background:#d8f3e7;color:#116744}.tag.pending{background:#ffefdc;color:#8b570e}.big{font-weight:800;font-size:36px;text-align:center}.counter{display:grid;grid-template-columns:1fr 1fr;gap:10px}.counter>div{padding:14px;text-align:center;background:#f0f6f7;border-radius:12px}.counter b{display:block;font-size:29px}.product{border-top:1px solid #e5edef;padding-top:16px}.nav{display:flex;justify-content:space-between;gap:8px}.notice{background:#fff5df;border-left:4px solid #d58b17;padding:12px;border-radius:7px}.error{background:#fce9e7;border-left:4px solid #c03535;padding:12px}.hide{display:none!important}#msg{position:sticky;top:0;z-index:10}.mini{font-size:12px}progress{width:100%;height:12px;accent-color:#17845e}details{margin-bottom:10px}summary{cursor:pointer;font-weight:600}a{color:#176b86}button:focus-visible,input:focus-visible{outline:3px solid #71a6cc} </style></head><body>
<div class="top"><div><b>DEL PALACIO</b><br><small>Control de Cargas · Piloto Casa Central</small></div><div id="identity"></div></div><div id="msg"></div><main class="wrap" id="root"></main>
<script>
let token=sessionStorage.getItem('cc_token')||'',me=null,load=null,check=null,idx=0,mode='',truckLoads=[];
const root=document.querySelector('#root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=(message,isErr=false)=>{document.querySelector('#msg').innerHTML=`<div class="${isErr?'error':'notice'}">${esc(message)}</div>`;setTimeout(()=>document.querySelector('#msg').replaceChildren(),5000)};
async function api(path,method='GET',body){let opts={method,headers:{Authorization:'Bearer '+token}};if(body instanceof FormData)opts.body=body;else if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}let r=await fetch('/api'+path,opts);let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Error de conexión');return j}
async function attempt(fn){try{await fn()}catch(e){notice(e.message,true)}}
function layout(html){root.innerHTML=html;document.querySelector('#identity').innerHTML=me?`${esc(me.name)} <button class="secondary mini" onclick="logout()">Salir</button>`:''}
function logout(){token='';me=null;sessionStorage.removeItem('cc_token');loginView()}
function loginView(){layout(`<div class="card" style="max-width:430px;margin:35px auto"><h1>Ingresar</h1><form onsubmit="event.preventDefault();attempt(signin)"><div class="field"><label>Usuario</label><input id="username" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="ok" style="width:100%">Iniciar sesión</button><p class="muted">Las cuentas las crea el administrador.</p></form></div>`)}
async function signin(){let response=await api('/login','POST',{username:document.querySelector('#username').value,password:document.querySelector('#password').value});token=response.token;sessionStorage.setItem('cc_token',token);me=response.user;home()}
async function home(){let list=await api('/loads');let groups={};list.forEach(l=>{let key=[l.branch,l.load_date,l.truck].join('|');(groups[key]??=[]).push(l)});let isManager=['admin','supervisor'].includes(me.role);layout(`<div class="row"><h1>Camiones y planillas</h1><button class="secondary" onclick="home()">Actualizar</button></div>${isManager?`<div class="card"><h2>Importar planillas PDF</h2><input id="pdf" type="file" accept="application/pdf" multiple><p class="muted">Se validan todas las líneas de cada PDF antes de guardarlo. Evitá importar un reparto dos veces.</p><button onclick="attempt(upload)">Importar PDF</button> <button class="secondary" onclick="shortages()">Faltantes y Chess</button> ${me.role==='admin'?'<button class="secondary" onclick="users()">Usuarios</button>':''}</div>`:''}${!list.length?'<div class="card">Todavía no hay planillas importadas.</div>':''}${Object.values(groups).map(group=>{let l=group[0],st=l.truck_status;return `<div class="card"><div class="row"><h2>Camión ${esc(l.truck)}</h2><span class="tag ${st.released_at?'done':'pending'}">${st.released_at?'Liberado':st.allowed?'Listo':'Bloqueado'}</span></div><p class="muted">${esc(l.load_date)} · ${esc(l.branch)} · ${group.length} planilla(s)</p>${group.map(x=>`<div class="row" style="padding:8px 0;border-top:1px solid #e8eff0"><div><b>Planilla ${esc(x.reparto)}</b><br><small class="muted">${x.canchas.filter(c=>c.status.done).length}/${x.canchas.length} canchas completas</small></div><button onclick="openLoad(${x.id})">Ver canchas</button></div>`).join('')}<div class="muted">Activos: ${st.assets?'registrados':'pendientes'} · Faltantes: ${st.shortages.length} (${st.shortages.filter(x=>!x.approved_by).length} sin autorizar)</div>${st.complete&&!st.assets?`<button class="ok" onclick="assets(${l.id})">Registrar activos de salida</button>`:''}</div>`}).join('')}`)}
async function upload(){let files=document.querySelector('#pdf').files;if(!files.length)throw new Error('Elegí uno o más PDF');let fd=new FormData();for(let f of files)fd.append('files',f);let r=await api('/import','POST',fd);notice('Importados '+r.length+' PDF correctamente');home()}
async function openLoad(id){load=await api('/loads/'+id);layout(`<button class="secondary" onclick="home()">← Camiones</button><div class="card"><h2>Camión ${esc(load.camion)} · Planilla ${esc(load.reparto)}</h2><p class="muted">${esc(load.chofer)} · ${esc(load.fecha)}</p><p>Elegí libremente la cancha disponible. El orden de sus productos es el de Chess.</p></div>${load.canchas.map(c=>{let st=c.status;let first=st.checks.find(x=>x.stage===1),second=st.checks.find(x=>x.stage===2);let own=st.checks.find(x=>x.user_id===me.id&&x.status==='active');let eligible=!first?1:(first.status==='done'&&!second&&first.user_id!==me.id?2:null);return `<div class="card"><div class="row"><h3>Cancha ${c.numero}</h3><span class="tag ${st.done?'done':'pending'}">${st.done?'Doble control OK':first?.status==='done'?'Control 2 pendiente':first?'Control 1 en proceso':'Sin iniciar'}</span></div><p class="muted">${c.productos.length} productos</p>${own?`<button onclick="begin(${c.numero},${own.stage})">Retomar mi control ${own.stage}</button>`:eligible?`<button onclick="begin(${c.numero},${eligible})">Comenzar control ${eligible}</button>`:''}${first?.status==='active'&&first.user_id!==me.id?'<p class="muted">Primer control reservado por otro empleado</p>':''}${second?.status==='active'&&second.user_id!==me.id?'<p class="muted">Segundo control reservado por otro empleado</p>':''}${st.done&&['admin','supervisor'].includes(me.role)?`<button class="outline" onclick="reopen(${c.numero})">Reabrir cancha</button>`:''}</div>`}).join('')}`)}
async function begin(court,stage){let r=await api(`/loads/${load.id}/court/${court}/start/${stage}`,'POST');check=await api('/checks/'+r.check_id);idx=check.court.productos.findIndex(p=>!check.answers[p.sku]);if(idx<0)idx=0;mode='';checkView()}
function checkView(){let p=check.court.productos[idx],all=check.court.productos,done=Object.keys(check.answers).length,ans=check.answers[p.sku];layout(`<button class="secondary" onclick="openLoad(${load.id})">← Canchas</button><div class="card"><div class="row"><h2>Cancha ${check.court.numero}</h2><span class="tag">Control ${check.check.stage}</span></div><p class="muted">Planilla ${esc(load.reparto)}</p><b>${done}/${all.length} productos registrados</b><progress value="${done}" max="${all.length}"></progress></div><div class="card product"><div class="row"><span class="tag">Producto ${idx+1} / ${all.length}</span>${ans?'<span class="tag done">Registrado</span>':''}</div><p class="muted">${esc(p.almacen)} · SKU ${esc(p.sku)}</p><h2>${esc(p.descripcion)}</h2><div class="counter"><div><small>BULTOS CHESS</small><b>${p.bultos}</b></div><div><small>UNIDADES CHESS</small><b>${p.unidades}</b></div></div>${mode?`<h3>${mode==='shortage'?'Falta real de stock':'Diferencia corregida físicamente'}</h3>${mode==='shortage'?'<p class="notice">Registrá cuánto viajará efectivamente. Un supervisor deberá autorizar el faltante antes de liberar.</p>':'<p>Describí el error que detectaste y corregiste antes de confirmar OK.</p>'}<div class="grid"><div><label>Bultos físicos</label><input id="realb" type="number" min="0" value="${mode==='shortage'?0:p.bultos}"></div><div><label>Unidades físicas</label><input id="realu" type="number" min="0" value="${mode==='shortage'?0:p.unidades}"></div></div><div class="field"><label>Observación ${mode==='corrected'?'obligatoria':''}</label><textarea id="note" rows="2" placeholder="Describir incidencia"></textarea></div><button class="${mode==='shortage'?'danger':'ok'}" onclick="attempt(saveAnswer)">Guardar y continuar</button> <button class="secondary" onclick="mode='';checkView()">Cancelar</button>`:`<p><b>¿El producto coincide con Chess?</b></p><div class="grid"><button class="ok" onclick="attempt(()=>sendAnswer({result:'ok'}))">✓ Correcto →</button><button class="warn" onclick="mode='corrected';checkView()">Error corregido</button><button class="danger" onclick="mode='shortage';checkView()">Falta de stock</button></div>`}<div class="nav" style="margin-top:16px"><button class="outline" ${idx===0?'disabled':''} onclick="idx--;mode='';checkView()">← Anterior</button><button class="outline" ${idx===all.length-1?'disabled':''} onclick="idx++;mode='';checkView()">Siguiente →</button></div></div><div class="card"><h3>Avance de la cancha</h3>${all.map((x,i)=>`<button class="${check.answers[x.sku]?'ok':'secondary'}" style="margin:3px;padding:8px" onclick="idx=${i};mode='';checkView()">${i+1}</button>`).join('')}<br><br><button class="ok" ${done!==all.length?'disabled':''} onclick="attempt(finish)">Finalizar control ${check.check.stage}</button></div>`)}
async function saveAnswer(){let b=Number(document.querySelector('#realb').value),u=Number(document.querySelector('#realu').value),note=document.querySelector('#note').value;if(!Number.isInteger(b)||!Number.isInteger(u)||b<0||u<0)throw Error('Cantidades inválidas');await sendAnswer({result:mode,physical_b:b,physical_u:u,note})}
async function sendAnswer(body){let p=check.court.productos[idx];await api(`/checks/${check.check.id}/answer/${encodeURIComponent(p.sku)}`,'POST',body);check=await api('/checks/'+check.check.id);if(idx<check.court.productos.length-1)idx++;mode='';checkView()}
async function finish(){await api(`/checks/${check.check.id}/finish`,'POST');notice('Control completado');openLoad(load.id)}
async function reopen(c){let reason=prompt('Motivo obligatorio de reapertura');if(reason===null)return;await api(`/loads/${load.id}/court/${c}/reopen`,'POST',{reason});notice('Cancha reabierta; requiere nuevamente los dos controles');openLoad(load.id)}
async function assets(loadId){load=await api('/loads/'+loadId);let types=await api('/asset-types');layout(`<button class="secondary" onclick="home()">← Camiones</button><div class="card"><h2>Activos de salida · Camión ${esc(load.camion)}</h2><p>Contá los activos físicos del camión. Completá todos los campos, incluido 0 cuando no lleve ese activo.</p><form onsubmit="event.preventDefault();attempt(saveAssets)">${types.map((t,i)=>`<div class="field row"><label style="flex:1">${esc(t)}</label><input style="width:100px" type="number" min="0" step="1" required data-asset="${esc(t)}" placeholder="Cantidad"></div>`).join('')}<button class="ok">Confirmar activos de salida</button></form></div>`)}
async function saveAssets(){let quantities={};document.querySelectorAll('[data-asset]').forEach(x=>quantities[x.dataset.asset]=Number(x.value));let r=await api('/assets','POST',{branch:load.deposito,load_date:load.fecha,truck:load.camion,quantities});notice(r.released_at?'Activos confirmados y camión liberado automáticamente':'Activos confirmados; camión continúa bloqueado por pendientes');home()}
async function shortages(){let list=await api('/shortages');layout(`<button class="secondary" onclick="home()">← Camiones</button><h1>Faltantes y ajustes pendientes de Chess</h1>${list.length?'':'<div class="card">No hay faltantes registrados.</div>'}${list.map(x=>`<div class="card"><div class="row"><h3>SKU ${x.sku} · Camión ${esc(x.truck)}</h3><span class="tag ${x.approved_by?'done':'pending'}">${x.approved_by?'Autorizado':'Requiere autorización'}</span></div><p class="muted">Reparto ${esc(x.reparto)} · Cancha ${x.court}</p><p>Chess: ${x.expected_b} bultos + ${x.expected_u} unidades<br>Viaja: <b>${x.actual_b} bultos + ${x.actual_u} unidades</b></p><p class="muted">${esc(x.note)}</p>${!x.approved_by?`<button class="warn" onclick="attempt(async()=>{await api('/shortages/${x.id}/approve','POST');shortages()})">Autorizar salida con faltante</button>`:!x.adjusted_by?`<div class="notice">Ajuste en Chess pendiente</div><button class="outline" onclick="attempt(async()=>{await api('/shortages/${x.id}/adjusted','POST');shortages()})">Confirmar ajuste manual en Chess</button>`:'<span class="tag done">Ajuste de Chess confirmado</span>'}</div>`).join('')}`)}
async function users(){let list=await api('/users');layout(`<button class="secondary" onclick="home()">← Camiones</button><div class="card"><h2>Usuarios</h2>${list.map(u=>`<p>${esc(u.name)} · ${esc(u.username)} · ${esc(u.role)}</p>`).join('')}</div><div class="card"><h2>Crear empleado</h2><form onsubmit="event.preventDefault();attempt(addUser)"><div class="field"><label>Nombre</label><input id="newname" required></div><div class="field"><label>Usuario</label><input id="newuser" required></div><div class="field"><label>Contraseña (10 caracteres mínimo)</label><input id="newpass" type="password" minlength="10" required></div><div class="field"><label>Rol</label><select id="newrole"><option value="controller">Controlador</option><option value="supervisor">Supervisor</option><option value="admin">Administrador</option></select></div><button class="ok">Crear usuario</button></form></div>`)}
async function addUser(){await api('/users','POST',{username:document.querySelector('#newuser').value,name:document.querySelector('#newname').value,password:document.querySelector('#newpass').value,role:document.querySelector('#newrole').value});notice('Usuario creado');users()}
(async()=>{if(token){try{me=await api('/me');home()}catch(e){logout()}}else loginView()})();
</script></body></html>
